[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rebot"
version = "0.1.0"
description = "Simulator for an autonomous waste-collection robot."
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/rebot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
strict_config = true
strict_markers = true

[tool.coverage.run]
branch = true
source = ["rebot"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-bdd>=8.1.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
